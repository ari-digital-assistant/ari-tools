name: ci

# The repo's workflows consume these scripts (manifest publishing) but nothing
# ran their tests until something broke at 3am. This is that missing gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ari-tools
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install pytest requests

      - name: Run tests
        run: python3 -m pytest -q
